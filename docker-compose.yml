# Run Inkling on something that is always on — a NAS, a home server, a small VPS.
#
#   mkdir -p server/data          # or copy your existing one here
#   docker compose up -d --build
#
# Then reach it from your phone and your laptop at the same address. Because the server
# serves the app itself, there is nothing to configure on either device: open the
# address, and `/api` is already right.

services:
  inkling:
    build: .
    image: inkling:latest
    container_name: inkling
    restart: unless-stopped

    ports:
      # Bound to this machine only, which is right when nginx runs on the same host:
      # it proxies to 127.0.0.1:8787 and nothing else can reach the port.
      #
      # If nginx is itself in Docker, or on another machine, it cannot see 127.0.0.1 —
      # set INKLING_BIND=0.0.0.0 and let your network be the boundary, or put both
      # containers on one Docker network and use the container name as the upstream.
      #
      #   INKLING_BIND=0.0.0.0 docker compose up -d
      #
      # Tailscale instead of nginx also works, and gives the phone a real certificate:
      #
      #   tailscale serve --bg 8787
      #
      # A secure context is not optional — the app hashes image blobs with
      # crypto.subtle, which the browser exposes only over https or on localhost, so on
      # a plain http:// address image capture fails while everything else looks fine.
      - "${INKLING_BIND:-127.0.0.1}:8787:8787"

    volumes:
      # Where everything lives: the accounts, and then per account their logs, blobs and
      # settings. A plain directory rather than a Docker volume, so putting your existing
      # Inklings on the server is an ordinary copy — no `docker cp`, and backing it up is
      # a copy of a folder you can see.
      #
      # Create it before the first start, or Docker makes it owned by root.
      # Set INKLING_DATA_DIR to keep it elsewhere, e.g. /volume1/inkling.
      - ${INKLING_DATA_DIR:-./server/data}:/data

      # Optional — the Obsidian vault, so "Promote to note" can write. Point it at the
      # folder your notes sync to and set the vault to /vault in Settings. Without it
      # everything works except promotion, which says plainly that it could not write.
      # - /volume1/Notebook:/vault

      # Optional — TLS on the container itself. Normally unnecessary: your reverse proxy
      # terminates TLS and talks plain http to this. Set both only if the proxy insists
      # on an https:// upstream. Mount the files in and point at the paths inside.
      # - ./certs:/certs:ro

    environment:
      - TZ=${TZ:-UTC}

      # Create the first account without clicking through setup. Leave both out and the
      # app asks you to make one on first open — that account becomes the admin. Not
      # needed if you are copying an existing data directory, which already has accounts.
      # - INKLING_ADMIN_USER=sam
      # - INKLING_ADMIN_PASSWORD=

      # Everything below is normally set in the app (Home → ⚙) and saved per account
      # into /data/users/<id>/config.json. Set them here only to get a fresh start going
      # without typing keys into a phone.
      #
      # - INKLING_VAULT=/vault
      # - INKLING_VAULT_FOLDER=Notes
      # - INKLING_PROVIDER=opencode-go
      # - INKLING_MODEL=deepseek-v4.1-flash
      # - INKLING_API_KEY=
      # - INKLING_EMBED_PROVIDER=omlx
      # - INKLING_EMBED_MODEL=granite-embedding-small-english-r2

      # Only if the reverse proxy insists on an https:// upstream. Both are needed, and
      # the files must be mounted in — see the volumes above.
      # - INKLING_TLS_CERT=/certs/fullchain.pem
      # - INKLING_TLS_KEY=/certs/privkey.pem
